name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"  # keep gradient-boosting threads from oversubscribing CI
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check rotorwatch tests

      - name: Test with coverage
        run: pytest --cov=rotorwatch --cov-report=term-missing --cov-fail-under=85

      - name: Smoke-test the CLI
        run: python -m rotorwatch.cli demo --units 20 --folds 3
